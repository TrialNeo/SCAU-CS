
<style>
  .arr-box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: var(--border-radius-md);
    font-size: 16px; font-weight: 500; border: 0.5px solid var(--color-border-tertiary);
    transition: all 0.3s;
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    position: relative;
  }
  .arr-box.sorted   { background:#E1F5EE; color:#085041; border-color:#5DCAA5; }
  .arr-box.current  { background:#EEEDFE; color:#3C3489; border-color:#7F77DD; }
  .arr-box.lo       { background:#FAEEDA; color:#633806; border-color:#EF9F27; }
  .arr-box.hi       { background:#FAEEDA; color:#633806; border-color:#EF9F27; }
  .arr-box.mid      { background:#FAECE7; color:#4A1B0C; border-color:#D85A30; }
  .arr-box.shifting { background:#E6F1FB; color:#042C53; border-color:#378ADD; }
  .step-btn {
    padding: 8px 20px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary); font-size: 14px; cursor: pointer;
  }
  .step-btn:hover { background: var(--color-background-secondary); }
  .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .legend-dot { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; }
  .log-line { font-size:13px; color:var(--color-text-secondary); margin:3px 0; line-height:1.5; }
  .log-line.active { color:var(--color-text-primary); font-weight:500; }
  .ptr-label {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 500;
  }
  .ptr-lo   { color: #BA7517; }
  .ptr-hi   { color: #BA7517; }
  .ptr-mid  { color: #993C1D; }
</style>

<h2 class="sr-only">折半插入排序可视化</h2>

<div style="padding:1rem 0 0;">
  <div style="font-size:13px; color:var(--color-text-secondary); margin-bottom:6px;">
    初始数组：<span id="init-display"></span>
  </div>

  <div style="position:relative; margin: 2rem 0 0.5rem;">
    <div id="array-display" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>
  <div id="index-labels" style="display:flex; gap:8px; margin-bottom:1.5rem; flex-wrap:wrap;"></div>

  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:1.5rem;">
    <button class="step-btn" id="btn-prev" onclick="prevStep()">← 上一步</button>
    <button class="step-btn" id="btn-next" onclick="nextStep()">下一步 →</button>
    <button class="step-btn" onclick="reset()"><i class="ti ti-refresh" aria-hidden="true"></i> 重置</button>
    <span id="progress" style="font-size:13px; color:var(--color-text-secondary);"></span>
  </div>

  <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px 16px; margin-bottom:1.5rem; min-height:52px;">
    <p id="step-desc" style="margin:0; font-size:14px; color:var(--color-text-primary); line-height:1.6;"></p>
  </div>

  <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:1.5rem;">
    <span style="font-size:12px; color:var(--color-text-secondary);"><span class="legend-dot" style="background:#EEEDFE;border:0.5px solid #7F77DD;"></span>当前插入元素 key</span>
    <span style="font-size:12px; color:var(--color-text-secondary);"><span class="legend-dot" style="background:#FAEEDA;border:0.5px solid #EF9F27;"></span>lo / hi 指针</span>
    <span style="font-size:12px; color:var(--color-text-secondary);"><span class="legend-dot" style="background:#FAECE7;border:0.5px solid #D85A30;"></span>mid 比较点</span>
    <span style="font-size:12px; color:var(--color-text-secondary);"><span class="legend-dot" style="background:#E6F1FB;border:0.5px solid #378ADD;"></span>后移中</span>
    <span style="font-size:12px; color:var(--color-text-secondary);"><span class="legend-dot" style="background:#E1F5EE;border:0.5px solid #5DCAA5;"></span>已排好序</span>
  </div>

  <div style="border-top:0.5px solid var(--color-border-tertiary); padding-top:12px;">
    <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 6px;">操作记录</p>
    <div id="log-lines"></div>
  </div>
</div>

<script>
const INIT = [5, 2, 8, 1, 9, 3];

let steps = [];
let stepIdx = 0;

function buildSteps(arr) {
  const a = [...arr];
  const s = [];
  const n = a.length;

  s.push({
    arr:[...a], sorted:[0], current:-1, lo:-1, hi:-1, mid:-1, shifting:[],
    desc:`开始折半插入排序。第一个元素 <b>${a[0]}</b> 默认已排好序（绿色）。`,
    log:`初始数组：[${a.join(', ')}]`
  });

  for (let i = 1; i < n; i++) {
    const key = a[i];
    s.push({
      arr:[...a], sorted:range(i), current:i, lo:-1, hi:-1, mid:-1, shifting:[],
      desc:`取出第 ${i+1} 个元素 <b>${key}</b>（紫色）。在左边已排序的 ${i} 个元素中用<b>二分查找</b>找插入位置。`,
      log:`── 取出 key = ${key}，二分范围 [0, ${i-1}]`
    });

    let lo = 0, hi = i - 1;
    while (lo <= hi) {
      const mid = Math.floor((lo + hi) / 2);
      s.push({
        arr:[...a], sorted:range(i), current:i, lo, hi, mid, shifting:[],
        desc:`二分：lo=${lo}, hi=${hi}, mid=${mid}，arr[mid]=<b>${a[mid]}</b> vs key=<b>${key}</b>。${a[mid] > key ? `${a[mid]} > ${key}，向左缩小范围` : `${a[mid]} ≤ ${key}，向右缩小范围`}`,
        log:`  lo=${lo} hi=${hi} mid=${mid}：arr[${mid}]=${a[mid]} ${a[mid]>key?'>':'≤'} ${key} → ${a[mid]>key?`hi=${mid-1}`:`lo=${mid+1}`}`
      });
      if (a[mid] > key) hi = mid - 1;
      else lo = mid + 1;
    }

    const insertPos = lo;
    const shifting = range(insertPos, i);
    s.push({
      arr:[...a], sorted:range(i), current:i, lo:-1, hi:-1, mid:-1, shifting,
      desc:`二分结束，插入位置确定为 <b>${insertPos}</b>。将 arr[${insertPos}..${i-1}] 整体右移一格（蓝色）。`,
      log:`  插入位置=${insertPos}，右移 arr[${insertPos}..${i-1}]`
    });

    for (let j = i; j > insertPos; j--) a[j] = a[j-1];
    a[insertPos] = key;

    s.push({
      arr:[...a], sorted:range(i+1), current:-1, lo:-1, hi:-1, mid:-1, shifting:[],
      desc:`<b>${key}</b> 放入位置 ${insertPos}，前 ${i+1} 个元素已排好序。`,
      log:`  ${key} → 位置 ${insertPos} ✓  [${a.slice(0,i+1).join(', ')}]`
    });
  }

  s.push({
    arr:[...a], sorted:range(n), current:-1, lo:-1, hi:-1, mid:-1, shifting:[],
    desc:`🎉 排序完成！最终结果：[${a.join(', ')}]`,
    log:`完成 → [${a.join(', ')}]`
  });
  return s;
}

function range(start, end) {
  if (end === undefined) { end = start; start = 0; }
  const r = [];
  for (let i = start; i < end; i++) r.push(i);
  return r;
}

function render() {
  const st = steps[stepIdx];
  const n = st.arr.length;

  const disp = document.getElementById('array-display');
  const labels = document.getElementById('index-labels');
  disp.innerHTML = '';
  labels.innerHTML = '';

  for (let i = 0; i < n; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative; padding-top:22px;';

    const box = document.createElement('div');
    box.className = 'arr-box';

    const ptrs = [];
    if (i === st.lo)  ptrs.push({label:'lo',  cls:'ptr-lo'});
    if (i === st.hi)  ptrs.push({label:'hi',  cls:'ptr-hi'});
    if (i === st.mid) ptrs.push({label:'mid', cls:'ptr-mid'});

    if (ptrs.length) {
      const p = document.createElement('div');
      p.className = 'ptr-label';
      p.innerHTML = ptrs.map(x=>`<span class="${x.cls}">${x.label}</span>`).join(' ');
      wrap.appendChild(p);
    }

    if (st.shifting.includes(i)) box.classList.add('shifting');
    else if (i === st.mid) box.classList.add('mid');
    else if (i === st.lo || i === st.hi) box.classList.add('lo');
    else if (i === st.current) box.classList.add('current');
    else if (st.sorted.includes(i)) box.classList.add('sorted');

    box.textContent = st.arr[i];
    wrap.appendChild(box);
    disp.appendChild(wrap);

    const lbl = document.createElement('div');
    lbl.style.cssText = 'width:44px; text-align:center; font-size:11px; color:var(--color-text-secondary); padding-top:22px;';
    lbl.textContent = i;
    labels.appendChild(lbl);
  }

  document.getElementById('step-desc').innerHTML = st.desc;
  document.getElementById('progress').textContent = `步骤 ${stepIdx+1} / ${steps.length}`;
  document.getElementById('btn-prev').disabled = stepIdx === 0;
  document.getElementById('btn-next').disabled = stepIdx === steps.length - 1;

  const logDiv = document.getElementById('log-lines');
  logDiv.innerHTML = '';
  steps.slice(0, stepIdx+1).forEach((s, idx) => {
    const p = document.createElement('p');
    p.className = 'log-line' + (idx === stepIdx ? ' active' : '');
    p.textContent = s.log;
    logDiv.appendChild(p);
  });
  logDiv.scrollTop = logDiv.scrollHeight;
}

function nextStep() { if (stepIdx < steps.length-1) { stepIdx++; render(); } }
function prevStep() { if (stepIdx > 0) { stepIdx--; render(); } }
function reset() { stepIdx = 0; render(); }

steps = buildSteps(INIT);
document.getElementById('init-display').textContent = `[${INIT.join(', ')}]`;
render();
</script>
