
<style>
  #qs-root { padding: 1rem 0; font-family: var(--font-sans); }
  .bar-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 180px; margin: 1rem 0; }
  .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-radius: 4px 4px 0 0; transition: height 0.35s ease, background 0.25s; min-width: 36px; position: relative; }
  .bar span { font-size: 12px; font-weight: 500; padding-bottom: 4px; color: var(--color-text-primary); }
  .bar.normal { background: #AFA9EC; }
  .bar.pivot  { background: #EF9F27; }
  .bar.left   { background: #5DCAA5; }
  .bar.right  { background: #F09595; }
  .bar.sorted { background: #97C459; }
  .bar.comparing { background: #FAC775; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0.5rem 0 1rem; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }
  .controls { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; }
  .log { min-height: 44px; font-size: 13px; color: var(--color-text-secondary); text-align: center; margin: 0.5rem 0; line-height: 1.6; }
  .step-info { font-size: 12px; color: var(--color-text-tertiary); text-align: center; margin-top: 2px; }
</style>
<div id="qs-root">
  <h2 class="sr-only">快速排序动画演示</h2>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>基准元素(pivot)</div>
    <div class="leg"><div class="leg-dot" style="background:#5DCAA5"></div>左侧(≤ pivot)</div>
    <div class="leg"><div class="leg-dot" style="background:#F09595"></div>右侧(> pivot)</div>
    <div class="leg"><div class="leg-dot" style="background:#97C459"></div>已排序</div>
  </div>
  <div class="bar-wrap" id="bars"></div>
  <div class="log" id="log">按「下一步」开始</div>
  <div class="step-info" id="step-info"></div>
  <div class="controls">
    <button onclick="resetArr()">重置</button>
    <button onclick="prevStep()" id="btn-prev" disabled>上一步</button>
    <button onclick="nextStep()" id="btn-next">下一步 ↗</button>
    <button onclick="autoPlay()" id="btn-auto">自动播放</button>
  </div>
</div>
<script>
const INIT = [38, 27, 43, 15, 31, 9, 47, 22];
let steps = [], cur = -1, timer = null;

function buildSteps(arr) {
  const s = [];
  const sorted = new Set();
  function snap(a, pivotIdx, leftSet, rightSet, msg, newSorted) {
    const ns = new Set([...sorted, ...(newSorted||[])]);
    newSorted && newSorted.forEach(i => sorted.add(i));
    s.push({ arr: [...a], pivot: pivotIdx, left: new Set(leftSet), right: new Set(rightSet), sorted: new Set(ns), msg });
  }
  function qs(a, lo, hi) {
    if (lo >= hi) {
      if (lo === hi) sorted.add(lo);
      return;
    }
    const pivotVal = a[hi];
    snap(a, hi, [], [], `选取 a[${hi}]=${pivotVal} 为基准(pivot)，选最右元素`);
    let i = lo - 1;
    for (let j = lo; j < hi; j++) {
      snap(a, hi, Array.from({length: j-lo}, (_,k)=>lo+k).concat(i>=lo?[...Array(i-lo+1).keys()].map(k=>lo+k):[]), [j], `比较 a[${j}]=${a[j]} 与 pivot=${pivotVal}`);
      if (a[j] <= pivotVal) {
        i++;
        [a[i], a[j]] = [a[j], a[i]];
        if (i !== j) snap(a, hi, Array.from({length: i-lo+1},(_,k)=>lo+k), [], `a[${j}] ≤ pivot，交换 a[${i}] 和 a[${j}]`);
      }
    }
    [a[i+1], a[hi]] = [a[hi], a[i+1]];
    const pi = i + 1;
    sorted.add(pi);
    snap(a, -1, Array.from({length: pi-lo},(_,k)=>lo+k), Array.from({length: hi-pi},(_,k)=>pi+1+k), `pivot ${pivotVal} 归位到 a[${pi}]`, [pi]);
    qs(a, lo, pi - 1);
    qs(a, pi + 1, hi);
    if (lo === 0 && hi === a.length - 1) {
      snap(a, -1, [], [], `排序完成！`, Array.from({length: a.length},(_,k)=>k));
    }
  }
  const a2 = [...arr];
  qs(a2, 0, a2.length - 1);
  return s;
}

function render() {
  const barWrap = document.getElementById('bars');
  const logEl = document.getElementById('log');
  const stepEl = document.getElementById('step-info');
  if (cur < 0) {
    const max = Math.max(...INIT);
    barWrap.innerHTML = INIT.map((v,i) =>
      `<div class="bar normal" style="height:${Math.round(v/max*160)}px"><span>${v}</span></div>`
    ).join('');
    logEl.textContent = '按「下一步」开始';
    stepEl.textContent = '';
    return;
  }
  const st = steps[cur];
  const max = Math.max(...st.arr);
  barWrap.innerHTML = st.arr.map((v,i) => {
    let cls = 'normal';
    if (st.sorted.has(i)) cls = 'sorted';
    else if (i === st.pivot) cls = 'pivot';
    else if (st.left.has(i)) cls = 'left';
    else if (st.right.has(i)) cls = 'right';
    return `<div class="bar ${cls}" style="height:${Math.round(v/max*160)}px"><span>${v}</span></div>`;
  }).join('');
  logEl.textContent = st.msg;
  stepEl.textContent = `步骤 ${cur+1} / ${steps.length}`;
  document.getElementById('btn-prev').disabled = cur <= 0;
  document.getElementById('btn-next').disabled = cur >= steps.length - 1;
}

function resetArr() {
  stopAuto();
  steps = buildSteps([...INIT]);
  cur = -1;
  render();
  document.getElementById('btn-prev').disabled = true;
  document.getElementById('btn-next').disabled = false;
}

function nextStep() {
  if (cur < steps.length - 1) { cur++; render(); }
}
function prevStep() {
  if (cur > 0) { cur--; render(); }
  else if (cur === 0) { cur = -1; render(); }
}
function stopAuto() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById('btn-auto').textContent = '自动播放';
}
function autoPlay() {
  if (timer) { stopAuto(); return; }
  document.getElementById('btn-auto').textContent = '暂停';
  timer = setInterval(() => {
    if (cur >= steps.length - 1) { stopAuto(); return; }
    cur++; render();
  }, 900);
}

resetArr();
</script>
